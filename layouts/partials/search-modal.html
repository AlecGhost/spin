<div id="search-modal" class="search-modal-backdrop" aria-hidden="true">
  <div class="search-container" role="dialog" aria-modal="true" aria-label="Site Search">
    <div class="search-input-wrapper">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input id="search-input" class="search-input" type="text" placeholder="Search by title, keywords or content..." autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" enterkeyhint="search" />
      <button id="search-modal-close" class="search-modal-close-btn" aria-label="Close search">
        <span class="desktop-esc-hint">ESC</span>
        <span class="mobile-close-hint">Cancel</span>
      </button>
    </div>

    <div id="search-modal-filter-bar" class="search-filter-bar">
      <button class="filter-btn active" data-collection="all">All</button>
    </div>

    <ul id="search-results" class="search-results-list"></ul>

    <div class="search-footer">
      <div class="search-shortcuts">
        <span><kbd class="kbd-shortcut">↑</kbd> <kbd class="kbd-shortcut">↓</kbd> navigate</span>
        <span><kbd class="kbd-shortcut">↵</kbd> select</span>
        <span><kbd class="kbd-shortcut">esc</kbd> close</span>
      </div>
      <div class="search-footer-info">Instant Full-Text Search</div>
    </div>
  </div>
</div>
