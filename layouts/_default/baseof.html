<!DOCTYPE html>
<html lang="{{ site.Language.Locale | default "en" }}">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  {{ partial "header.html" . }}

  <main class="site-main">
    {{ block "main" . }}{{ end }}
  </main>

  {{ partial "footer.html" . }}
  {{ partial "search-modal.html" . }}

  {{ $search := resources.Get "js/search.js" }}
  {{ with $search }}<script src="{{ .RelPermalink }}"></script>{{ end }}
</body>
</html>
